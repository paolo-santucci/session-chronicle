status: done
project-brief: |
  Initial canon for session-chronicle 0.2.1, a four-harness (OpenCode, Claude Code,
  Codex CLI, Pi) project-memory system. Product-first shape: capability slices are the
  spine, with two subordinate architecture/data-model slices (runtime-architecture,
  harness-adapters) recording the internal layout needed to reason about those
  capabilities. Gated capabilities are first-class: every slice states its own declared
  limits, and a dedicated capability-gates domain holds the cross-harness matrix of
  installed/activated/operational states, gate owners and permissible claims.
  Deliberate non-capabilities appear as declared limits, never silent absences.
  Scope is today's truth only, including contracts declared but not yet natively wired
  (continuations stay, marked pending). Excluded: roadmap ambition, competitor
  comparison, archived plans, refactor reports and verification logs. Deployment is in
  canon: one slice covers bundle contents, the standalone installer and the
  Chronicle/UAT ownership boundary.
phases:
